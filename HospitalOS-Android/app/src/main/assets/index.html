function getAiEndpoint() {
  let endpoint = "";
  try {
    if (window.MediSyncDAndroid && typeof window.MediSyncDAndroid.getAiEndpoint === "function") {
      endpoint = String(window.MediSyncDAndroid.getAiEndpoint() || "").trim();
    }
  } catch (_e) {}
  if (!endpoint) {
    try { endpoint = String(localStorage.getItem("medisyncd_ai_endpoint") || "").trim(); } catch (_e) {}
  }
  if (!endpoint) throw new Error("Domonique 2.0 is not connected yet. Tap the Android ⚙ settings button and enter your secure AI gateway URL. API keys are intentionally not stored in this APK.");
  if (!endpoint.startsWith("https://")) throw new Error("For security, the Domonique 2.0 gateway must use HTTPS.");
  return endpoint;
}
function getAiGatewayToken() {
  try {
    if (window.MediSyncDAndroid && typeof window.MediSyncDAndroid.getAiToken === "function") {
      return String(window.MediSyncDAndroid.getAiToken() || "");
    }
  } catch (_e) {}
  return "";
}
function aiHeaders(accept) {
  const h = { "Content-Type": "application/json", "Accept": accept };
  const token = getAiGatewayToken();
  if (token) h["X-MediSyncD-App-Token"] = token;
  return h;
}
function assertAiNetwork() {
  try {
    if (window.MediSyncDAndroid && typeof window.MediSyncDAndroid.isOnline === "function" && !window.MediSyncDAndroid.isOnline()) {
      throw new Error("Domonique 2.0 needs an internet connection for AI requests. The rest of HospitalOS remains available offline.");
    }
  } catch (e) {
    if (e && e.message && e.message.includes("internet connection")) throw e;
  }
}
function aiRequestBody(prompt, maxTokens, sys, stream) {
  return {
    model: "claude-sonnet-5",
    max_tokens: maxTokens,
    stream: !!stream,
    system: sys || SYS_CLINICAL,
    messages: [{ role: "user", content: prompt }],
    client: "medisyncd-hospitalos-4.1"
  };
}
async function aiClinical(prompt, maxTokens = 1200, sys = null) {
  assertAiNetwork();
  const res = await fetch(getAiEndpoint(), {
    method: "POST",
    headers: aiHeaders("application/json"),
    body: JSON.stringify(aiRequestBody(prompt, maxTokens, sys, false))
  });
  const d = await res.json().catch(() => ({}));
  if (!res.ok || d.error) throw new Error((d.error && (d.error.message || d.error)) || \`AI gateway error (\${res.status})\`);
  if (Array.isArray(d.content)) return d.content.map(b => b.text || "").join("");
  if (typeof d.output_text === "string") return d.output_text;
  if (typeof d.text === "string") return d.text;
  throw new Error("The AI gateway returned an unsupported response format.");
}
async function aiClinicalStream(prompt, onChunk, maxTokens = 1400, sys = null) {
  assertAiNetwork();
  const res = await fetch(getAiEndpoint(), {
    method: "POST",
    headers: aiHeaders("application/json, text/event-stream"),
    body: JSON.stringify(aiRequestBody(prompt, maxTokens, sys, true))
  });
  const ct = res.headers.get("content-type") || "";
  if (!res.ok) {
    const d = await res.json().catch(() => ({}));
    throw new Error((d.error && (d.error.message || d.error)) || \`AI gateway error (\${res.status})\`);
  }
  if (ct.includes("application/json")) {
    const d = await res.json();
    if (d.error) throw new Error(d.error.message || d.error);
    const text = Array.isArray(d.content) ? d.content.map(b => b.text || "").join("") : (d.output_text || d.text || "");
    if (!text) throw new Error("The AI gateway returned an empty response.");
    for (let i = 0; i < text.length; i += 12) {
      onChunk(text.slice(0, i + 12));
      await new Promise(r => setTimeout(r, 4));
    }
    onChunk(text);
    return text;
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let full = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    const chunk = dec.decode(value, {stream:true});
    chunk.split("\n").forEach(function (line) {
      if (line.startsWith("data:")) {
        try {
          const raw = line.slice(5).trim();
          if (!raw || raw === "[DONE]") return;
          const d2 = JSON.parse(raw);
          if (d2.type === "content_block_delta" && d2.delta && d2.delta.text) {
            full += d2.delta.text;
            onChunk(full);
          } else if (d2.delta && typeof d2.delta === "string") {
            full += d2.delta;
            onChunk(full);
          }
        } catch (_e) {}
      }
    });
  }
  if (!full) throw new Error("The AI gateway stream ended without content.");
  return full;
}
