plugins {
    id 'com.android.application'
}

android {
    namespace 'com.medisyncd.hospitalos'
    compileSdk 36

    defaultConfig {
        applicationId 'com.medisyncd.hospitalos'
        minSdk 26
        targetSdk 36
        versionCode 421
        versionName '4.2.1'
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.0'
}
