name: Build Ozone Sentinel Android Shell\n# Ozone V8 shell build trigger

on:
  push:
    branches:
      - ozone-v8-shell-build
    paths:
      - ".github/workflows/ozone-v8-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use hosted Android SDK and install API 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-35"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate shell project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shell/app/src/main/java/com/medisyncd/ozonesentinel
          mkdir -p shell/app/src/main/res/values
          mkdir -p shell/app/src/main/res/drawable
          mkdir -p shell/app/src/main/assets/www

          cat > shell/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  maven { url = uri("https://repo1.maven.org/maven2") }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  maven { url = uri("https://repo1.maven.org/maven2") }
                  mavenCentral()
              }
          }
          rootProject.name = 'OzoneSentinelShell'
          include ':app'
          EOF

          cat > shell/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > shell/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.medisyncd.ozonesentinel'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.medisyncd.ozonesentinel'
                  minSdk 26
                  targetSdk 35
                  versionCode 8
                  versionName '8.0.0'
              }

              buildTypes {
                  debug {
                      debuggable false
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > shell/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowBackground">#061018</item>
                  <item name="android:colorAccent">#4ED8E6</item>
                  <item name="android:navigationBarColor">#061018</item>
                  <item name="android:statusBarColor">#061018</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > shell/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#061018" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#175C7E" android:pathData="M54,12 L91,28 L87,64 C84,82 70,94 54,100 C38,94 24,82 21,64 L17,28 Z"/>
              <path android:fillColor="#69C98D" android:pathData="M32,46 C39,35 50,31 60,36 C68,40 72,48 79,51 C76,68 67,79 54,85 C42,80 34,69 31,57 Z"/>
              <path android:fillColor="#4ED8E6" android:pathData="M28,28 L80,28 L80,34 L28,34 Z"/>
          </vector>
          EOF

          cat > shell/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="false"
                  android:label="Ozone Sentinel Global"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > shell/app/src/main/assets/www/index.html <<'EOF'
          <!doctype html><html><body style="background:#061018;color:white;font-family:sans-serif"><h1>Ozone Sentinel Shell</h1></body></html>
          EOF

          cat > shell/app/src/main/java/com/medisyncd/ozonesentinel/MainActivity.java <<'EOF'
          package com.medisyncd.ozonesentinel;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.MimeTypeMap;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import java.io.IOException;
          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              private static final String HOST = "appassets.androidplatform.net";
              private static final String ORIGIN = "https://" + HOST;
              private static final int WEB_PERMISSION_REQUEST = 2048;
              private static final int FILE_PICKER_REQUEST = 2049;

              private WebView webView;
              private PermissionRequest pendingWebPermission;
              private GeolocationPermissions.Callback pendingGeoCallback;
              private String pendingGeoOrigin;
              private ValueCallback<Uri[]> pendingFileCallback;

              @Override
              @SuppressLint("SetJavaScriptEnabled")
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(0xFF061018);
                  getWindow().setNavigationBarColor(0xFF061018);

                  webView = new WebView(this);
                  webView.setBackgroundColor(0xFF061018);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowContentAccess(true);
                  s.setAllowFileAccess(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              List<String> needed = new ArrayList<>();
                              for (String resource : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)
                                          && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                                      needed.add(Manifest.permission.CAMERA);
                                  }
                              }
                              if (needed.isEmpty()) {
                                  request.grant(request.getResources());
                              } else {
                                  pendingWebPermission = request;
                                  requestPermissions(needed.toArray(new String[0]), WEB_PERMISSION_REQUEST);
                              }
                          });
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              callback.invoke(origin, true, false);
                          } else {
                              pendingGeoOrigin = origin;
                              pendingGeoCallback = callback;
                              requestPermissions(new String[]{
                                  Manifest.permission.ACCESS_FINE_LOCATION,
                                  Manifest.permission.ACCESS_COARSE_LOCATION
                              }, WEB_PERMISSION_REQUEST);
                          }
                      }

                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (pendingFileCallback != null) pendingFileCallback.onReceiveValue(null);
                          pendingFileCallback = filePathCallback;
                          try {
                              startActivityForResult(fileChooserParams.createIntent(), FILE_PICKER_REQUEST);
                              return true;
                          } catch (ActivityNotFoundException e) {
                              pendingFileCallback = null;
                              return false;
                          }
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if (!HOST.equals(uri.getHost())) return null;
                          String path = uri.getPath();
                          if (path == null || path.isEmpty() || "/".equals(path)) path = "/index.html";
                          if (path.startsWith("/api/")) return null;

                          String assetPath = "www" + path;
                          try {
                              InputStream input = getAssets().open(assetPath);
                              return new WebResourceResponse(mime(path), "UTF-8", input);
                          } catch (IOException ignored) {
                              String leaf = path.substring(path.lastIndexOf('/') + 1);
                              if (!leaf.contains(".")) {
                                  try {
                                      return new WebResourceResponse("text/html", "UTF-8", getAssets().open("www/index.html"));
                                  } catch (IOException ignoredAgain) {
                                      return null;
                                  }
                              }
                              return null;
                          }
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if (HOST.equals(uri.getHost())) return false;
                          String scheme = uri.getScheme();
                          if ("http".equalsIgnoreCase(scheme) || "https".equalsIgnoreCase(scheme)) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, uri));
                                  return true;
                              } catch (ActivityNotFoundException ignored) {}
                          }
                          return false;
                      }
                  });

                  webView.loadUrl(ORIGIN + "/index.html");
              }

              private String mime(String path) {
                  String lower = path.toLowerCase();
                  if (lower.endsWith(".html")) return "text/html";
                  if (lower.endsWith(".js") || lower.endsWith(".mjs")) return "application/javascript";
                  if (lower.endsWith(".css")) return "text/css";
                  if (lower.endsWith(".json")) return "application/json";
                  if (lower.endsWith(".webmanifest")) return "application/manifest+json";
                  if (lower.endsWith(".svg")) return "image/svg+xml";
                  if (lower.endsWith(".png")) return "image/png";
                  if (lower.endsWith(".jpg") || lower.endsWith(".jpeg")) return "image/jpeg";
                  if (lower.endsWith(".md")) return "text/markdown";
                  String ext = MimeTypeMap.getFileExtensionFromUrl(path);
                  String guessed = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext);
                  return guessed != null ? guessed : "application/octet-stream";
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode != WEB_PERMISSION_REQUEST) return;

                  boolean granted = grantResults.length > 0;
                  for (int result : grantResults) granted = granted && result == PackageManager.PERMISSION_GRANTED;

                  if (pendingWebPermission != null) {
                      if (granted) pendingWebPermission.grant(pendingWebPermission.getResources());
                      else pendingWebPermission.deny();
                      pendingWebPermission = null;
                  }
                  if (pendingGeoCallback != null) {
                      pendingGeoCallback.invoke(pendingGeoOrigin, granted, false);
                      pendingGeoCallback = null;
                      pendingGeoOrigin = null;
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != FILE_PICKER_REQUEST || pendingFileCallback == null) return;
                  Uri[] result = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                  pendingFileCallback.onReceiveValue(result);
                  pendingFileCallback = null;
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.loadUrl("about:blank");
                      webView.stopLoading();
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build shell APK with repository retry
        working-directory: shell
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            echo "Gradle build attempt $attempt"
            if gradle --no-daemon --stacktrace :app:assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 12))
          done

      - name: Verify shell APK
        shell: bash
        run: |
          set -euo pipefail
          APK="shell/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee shell/apk-metadata.txt
          grep -q "package: name='com.medisyncd.ozonesentinel'" shell/apk-metadata.txt
          unzip -l "$APK" | grep -q "assets/www/index.html"
          mkdir -p shell/dist
          cp "$APK" shell/dist/Ozone-Sentinel-Shell.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ozone-Sentinel-Android-Shell
          path: shell/dist/Ozone-Sentinel-Shell.apk
          if-no-files-found: error
          retention-days: 7
