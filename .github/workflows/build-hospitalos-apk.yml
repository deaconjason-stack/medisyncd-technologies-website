name: Build HospitalOS v4.1 APK

on:
  push:
    branches: [ hospitalos-apk-build-v4-1-0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HospitalOS-Android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Verify APK
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "package:|targetSdkVersion|application-label"
      - name: Package outputs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MediSyncD-HospitalOS-v4.1.apk
          cd ..
          zip -qr MediSyncD-HospitalOS-v4.1-Android-Source.zip HospitalOS-Android -x '*/build/*'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediSyncD-HospitalOS-v4.1-APK
          path: HospitalOS-Android/MediSyncD-HospitalOS-v4.1.apk
          if-no-files-found: error
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: MediSyncD-HospitalOS-v4.1-Android-Source
          path: MediSyncD-HospitalOS-v4.1-Android-Source.zip
          if-no-files-found: error
